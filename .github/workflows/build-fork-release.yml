name: Build Fork Release

# Stable build: version is the base from tauri.conf.json without any -beta suffix
# (2.5.8-beta.1 -> v2.5.8), or the optional input below. Published as a normal
# (non-prerelease) GitHub release. Manual only: pick the branch in "Run workflow".
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 2.5.8 (blank = base of tauri.conf.json)'
        required: false
        default: ''

jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: node .github/scripts/set-version.mjs "${INPUT_VERSION:-base}"
        shell: bash

      - name: Install 7z (Windows)
        run: choco install 7zip -y

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download MPV (Tauri Sidecar)
        run: bash scripts/download-mpv-tauri.sh
        shell: bash
        continue-on-error: true

      - name: Download FFmpeg (Tauri Sidecar)
        run: |
          cd packages/app
          node scripts/download-ffmpeg.js
        shell: bash
        continue-on-error: true

      - name: Setup libmpv (Windows)
        run: |
          powershell -ExecutionPolicy Bypass -File packages/app/src-tauri/setup-libmpv.ps1
          echo "LIBMPV_PATH=$GITHUB_WORKSPACE/packages/app/src-tauri/libmpv" >> $GITHUB_ENV
        shell: bash

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          VITE_TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          VITE_OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
        with:
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: 'Fork ${{ steps.version.outputs.tag }}'
          releaseBody: 'Fork release build from ${{ github.ref_name }} (${{ github.sha }}). See CHANGELOG.md on the branch.'
          releaseCommitish: ${{ github.sha }}
          prerelease: false
